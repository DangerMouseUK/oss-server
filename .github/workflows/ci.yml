name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The toolchain the gating jobs run on -- test (fmt + clippy) and docs.
  #
  # Those jobs deny warnings: `cargo clippy --workspace --all-targets --
  # -D warnings` and `RUSTDOCFLAGS: -D warnings`. On a floating channel that
  # means the day a new stable ships a new lint they go red on code nobody has
  # touched -- which is what happened to this repo's main on 2026-11-13, when
  # 1.100.0 arrived with two `needless_range_loop` findings 1.99 does not emit.
  #
  # The soak job is deliberately NOT pinned to this: it does not deny warnings,
  # so a new lint cannot redden it, and leaving it on floating `stable` is how a
  # genuinely broken release still gets caught here.
  #
  # Note the `uses:` ref stays @stable -- the ref pins the *action*, and the
  # `toolchain:` input below overrides the toolchain that branch would
  # otherwise default to. Changing the ref would not pin anything.
  #
  # To bump this value. It is a procedure, not a guess:
  #
  #   1. Look at the newest run of the "Rust drift" workflow
  #      (.github/workflows/rust-drift.yml). It runs these same
  #      warning-denying gates on floating `stable` every week, and its job
  #      summary names the stable it resolved and whether each gate passed
  #      on it. If there is no recent run, start one by hand:
  #      Actions -> Rust drift -> Run workflow.
  #   2. Bump only when that summary says every gate passed. If one failed,
  #      that failure is the work: fix it first, as its own change. Bumping
  #      on top of a failing gate only moves a red run out of a schedule and
  #      into a pull request, which is the thing the pin exists to stop.
  #   3. Raise this one value to the version the summary names, in a pull
  #      request that changes nothing else -- so CI proves it green on its
  #      own, and so it can be reverted on its own.
  #   4. oss-core, oss-server and oss-client each carry this value. Bump all
  #      three, and land oss-core first: the other two check it out as a
  #      sibling, so they are where a bad oss-core shows up.
  #
  # No bot does this. rust-drift.yml says why not, at some length.
  RUST_PINNED: "1.100.0"

# oss-core is consumed as a sibling path dependency (../oss-core), so both repos
# are checked out side by side.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: oss-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: oss-server
      - uses: actions/checkout@v4
        with:
          repository: DangerMouseUK/oss-core
          path: oss-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_PINNED }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oss-server
      # Plain `cargo fmt`, never `--all`: `--all` takes its package list from
      # `cargo metadata`, which here reaches the ../oss-core checkout above and
      # would redden this repo's CI for a formatting fault in that one.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # docs.rs builds every crate with all features; broken or ambiguous
  # intra-doc links fail here rather than render wrongly there.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oss-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: oss-server
      - uses: actions/checkout@v4
        with:
          repository: DangerMouseUK/oss-core
          path: oss-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_PINNED }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oss-server
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The game-logic half of the PRD budget: 500 players in one arena must fit
  # in 20% of a core, zone plus transport. This gates the zone's share only;
  # oss-core's own soak job gates the transport's. --max-playing 500 is what
  # makes it the PRD scenario: ASSS caps General:MaxPlaying at 100 per arena
  # by default, and without it 400 of the 500 sit in spectator mode and never
  # relay a position. See docs/performance.md.
  soak:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oss-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: oss-server
      - uses: actions/checkout@v4
        with:
          repository: DangerMouseUK/oss-core
          path: oss-core

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oss-server
      - run: cargo run --release -p oss-server --example soak -- --peers 500 --seconds 30 --max-playing 500 --max-cpu 15

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oss-server
      - uses: actions/checkout@v4
        with:
          repository: DangerMouseUK/oss-core
          path: oss-core
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: oss-server/Cargo.toml

[package]
name = "oss-server"
description = "Open SubSpace zone server, compatible with SubSpace/Continuum clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oss-proto.workspace = true
oss-net.workspace = true
oss-formats.workspace = true
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"

[dev-dependencies]

[lints]
workspace = true

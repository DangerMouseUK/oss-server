[licenses]
# This repo is GPL-2.0-or-later; Apache-2.0-only crates are fine (GPLv3-compatible via "or later").
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "0BSD", "BSL-1.0", "MPL-2.0", "GPL-2.0-or-later", "GPL-3.0-or-later", "LGPL-2.1-or-later", "OFL-1.1", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# advisories for unmaintained crates only fail for direct dependencies;
# vulnerabilities fail at any depth
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

;; Default arena settings (arenas without a directory of their own use
;; this file). From ASSS 1.4.4's arenas/(default)/arena.conf, with the
;; changes noted below.

; drop in all of svs settings here
#include conf/svs/svs.conf

; but override these particular ones
[Warbird]
XRadarStatus=0

[Javelin]
AntiWarpStatus=0

[Leviathan]
StealthStatus=0

[Bomb]
BombDamageLevel=7500


[ General ]
Map = smallmap.lvl
; LevelFiles = b1.lvz, b2.lvz
;; This line is ASSS 1.4.4's own, commented out there too, and b1.lvz and
;; b2.lvz are not among the files ASSS ships -- so uncommenting it would
;; name two files that do not exist and the arena would start with a
;; warning. This zone serves no LVZ in any arena, which is why a live run
;; here cannot show a client swapping one arena's LVZ set for another's.
;; The server side of that is covered by tests/lvz_arena_change.rs.


[ Misc ]
;; oss-server change: ASSS ships "$SEE_TEAM" and "$SEE_ALL" here, but ASSS
;; 1.4.4 never expands $ values, so they read as 0 (see nobody's energy).
;; The numbers below are what the names mean: 0 none, 1 all, 2 team, 3 spec.
SeeEnergy = 2
SpecSeeEnergy = 1


[ Modules ]
; this key holds the names of the modules that will take effect in this
; arena. typical things to put here are modules for scoring, special
; game types, flag guards, etc.
;; oss-server change: ASSS also attaches fm_normal and buy here; oss-server
;; doesn't have those modules yet (its game module includes a simple
;; frequency manager). Add fg_wz or fg_turf for a flag game.
AttachModules = points_kill points_flag points_goal


; separate out settings for flags and balls into separate files
#include flags.conf

#include balls.conf

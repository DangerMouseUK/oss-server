#include arenas/(default)/arena.conf

[ General ]

Map = scf.lvl

;; oss-server addition, not part of the ASSS sample zone: this arena serves
;; one LVZ and (default) serves none, so moving between them exercises a
;; client loading an arena's objects and dropping them again. scf-demo.lvz
;; is generated by `cargo run --example make_zone_lvz` -- see that file and
;; zone/arenas/scf/README.lvz for what is in it and why it is not borrowed.
LevelFiles = scf-demo.lvz

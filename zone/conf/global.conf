;; Zone-wide settings. Based on ASSS 1.4.4's conf/global.conf.
;;
;; Changes from the ASSS file: the [mysql] and log module sections are
;; removed (oss-server has no database or ASSS log modules yet; logs are
;; configured with --log / RUST_LOG), [Billing] is kept but commented out
;; so a test zone needs no user database server, and the directory server
;; list is commented out so a test zone never announces itself.

[ General ]

;PublicArenas = turf pb
NewsFile = news.txt


[ Listen ]
;; the main listening port (the ping port is this + 1)
Port = 5000


;; oss-server: the admin HTTP/WebSocket API and Prometheus metrics
;; (/metrics, /api/...). Off unless Listen is set; without a Token it only
;; listens on a loopback address. Requests send "Authorization: Bearer <token>".
[ Admin ]
; Listen = 127.0.0.1:5080
; Token = change-me


;; The user database server ("biller"). Uncomment this and `billing_ssc` in
;; modules.conf (and comment out `auth_file` there, which it replaces) to run
;; the zone against one. `oss-biller` is the bundled local one:
;;
;;   cargo run -p oss-biller -- --bind 127.0.0.1:1850 --db biller.db \
;;       --password <the Password below> --registration ask
;;
;; Registration: `ask` sends the client to its "new user" screen, `auto`
;; creates the account at the first login, `closed` refuses new names. Chat
;; clients cannot register at all (the chat protocol has no new-user flag), so
;; a zone whose players arrive that way wants `auto`.
;;
;; ServerID and ScoreID are the biller's names for this zone; zones sharing a
;; ScoreID share scores. LocalChats names `?chat` channels that stay in this
;; zone, LocalChatPrefix what to show in front of them.
[ Billing ]

; IP = 127.0.0.1
; Port = 1850
; Password = change-me
; ServerID = 1
; GroupID = 1
; ScoreID = 1
; ServerName = Open SubSpace test zone
; RetryInterval = 180
; LocalChats =
; LocalChatPrefix =


[ Directory ]

Name = Open SubSpace test zone
Description = An oss-server zone running its bundled default configuration.

;; directory servers to register with (load the `directory` module in
;; modules.conf too); left out so a test zone never announces itself:
; Server1 = sscentral.sscuservers.net
; Server2 = ssdir.playsubspace.com
; Server3 = zones.sscentral.com

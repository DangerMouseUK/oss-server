;; Modules to load at startup, one per line (read by oss-server exactly as
;; ASSS reads it). Based on ASSS 1.4.4's conf/modules.conf.
;;
;; Changes from the ASSS file: modules that oss-server doesn't have (yet)
;; are commented out with ";-" so the zone starts without warnings; ASSS's
;; own comments are kept. oss-server accepts the names of ASSS modules whose
;; job its core does (unixsignal, prng, logman, mainloop, config, net,
;; playerdata, ...) and ignores them.

unixsignal
deadlock

prng
logman
log_console
mainloop
config
log_file
playerdata
lagdata

bw_default
net
chatnet

arenaman
mapdata
capman
mapnewsdl
core
clientset
scoring:persist
;- idle: not implemented

cmdman
; obscene
chat

scoring:stats
scoring:basicstats

;- log_sysop: logging goes through tracing
;- log_staff: logging goes through tracing

;; enable this for password security without a billing server:
auth_file

security:security
; directory
; billing
;; if you're using a billing server, you'll probably want to use this:
; billing_ssc

; funky:auth_prefix
;; enable this for ?kick:
auth_ban
;; restricts arenas that set General:NeedCap to players with that capability:
; arenaperm

banners
game_timer
flagcore
balls
bricks
koth
;; LVZ object control (?objon, ?objoff, ?objset, ?objmove and the rest, and
;; the object packets bots relay). ASSS builds its objects module but its
;; own modules.conf does not list it, because its sample zone serves no LVZ
;; for it to drive -- those are one decision, not two. This zone does serve
;; one (arenas/scf/scf-demo.lvz), including an object left for ?objon, so it
;; loads the module: shipping the object without it would be half of each
;; choice and no use to anyone. What has to match ASSS byte for byte is the
;; client settings packet built from arena.conf, which this does not touch.
;; A zone with no LevelFiles can comment it out again at no cost -- with no
;; objects the module sends nothing and its commands are capability-gated.
objects
;- fm_normal: the game module is the frequency manager (ASSS fm_normal)
;; uncomment this in an arena that should hold everyone in spectator mode
;; (attach it per arena rather than loading it for the whole zone):
; fm_lockspec
game

lagaction
;; oss-server: server-side anti-cheat checks; inert unless
;; [AntiCheat] Enabled = 1 (and log-only unless Action is raised)
anticheat


;; Local passwords for the auth_file module.
;;
;; [Users] entries are "name = value": "lock" refuses the name, "any"
;; accepts any password, anything else is the password hash written by
;; ?passwd (compatible with ASSS).
;;
;; A name that is NOT listed below is governed by the three keys in
;; [General]:
;;
;;   AllowUnknown  (default yes, as in ASSS and Subspace Server .NET)
;;       Whether unlisted names may log in at all. Set it to "no" for a
;;       zone that only its listed players may enter.
;;
;;   ZonePassword  (no default)
;;       One shared password for the whole zone. With it set, an unlisted
;;       name is accepted only if it logs in with this password. Players
;;       who get in this way are NOT authenticated -- the zone password
;;       says which zone you may enter, not who you are -- so they never
;;       receive a staff group from staff.conf.
;;
;;       If AllowUnknown is on and this is unset and AllowAnyLogin is off,
;;       the server generates a zone password on start, prints it, and
;;       writes it here. That is what stops a zone nobody has configured
;;       from accepting any name with any password; see decision D29.
;;
;;   AllowAnyLogin  (default no)
;;       Set it to "yes" and any name logs in with any password, with no
;;       zone password at all. This is ASSS's shipped behaviour and it is a
;;       deliberate choice here rather than a default: on such a zone every
;;       name is a name anyone may claim. The server warns at every start
;;       while it is set. --insecure-allow-any-login does the same thing for
;;       one run.
;;
;; A zone with a billing server does not use any of this: the biller
;; replaces this module as the zone's authenticator.

[General]
AllowUnknown = yes

[Users]
